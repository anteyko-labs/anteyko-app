<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Anteyko — живые демо мобильных приложений для бизнеса: магазин, кафе, цветы, продукты, мебель, салон.">
  <meta name="theme-color" content="#F6F6F8">

  <!-- Открывать как приложение с экрана «Домой» (iPhone: Поделиться → На экран «Домой») -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Anteyko">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Anteyko — демо приложений</title>

  <style>
    html, body { margin: 0; height: 100%; background: #F6F6F8; }
    @media (prefers-color-scheme: dark) { html, body { background: #0E0F13; } }
    /* Заставка, пока грузится Flutter. Исчезает после первого кадра. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font: 600 15px -apple-system, system-ui, sans-serif; color: #8a8c96;
      transition: opacity .45s ease, transform .45s ease;
    }
    #splash .logo {
      width: 76px; height: 76px; border-radius: 22px;
      background: linear-gradient(135deg, #23263A, #0E0F13);
      color: #fff; display: grid; place-items: center;
      font: 800 38px -apple-system, system-ui, sans-serif;
      box-shadow: 0 18px 40px rgba(14, 15, 19, .25);
      animation: breathe 1.6s ease-in-out infinite;
    }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.08); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #2F5BEA, #FF6B2C, #C81E4A);
      animation: load 1.1s ease-in-out infinite;
    }
    #splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
    @keyframes breathe { 50% { transform: scale(1.06); } }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .logo, #splash .bar::after { animation: none; } }
  </style>
</head>
<body>
  <div id="splash"><div class="logo">A</div><div class="bar"></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
